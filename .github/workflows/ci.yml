name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Smoke test CLI against sample data
        run: uv run python -m ingest.fetch_transactions --source sample --raw-dir /tmp/ci-raw
